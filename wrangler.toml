name = "chatbot"
main = "build/index.js"
compatibility_date = "2026-05-04"
workers_dev = false
preview_urls = false

[build]
command = "cargo leptos build --release && cargo install -q \"worker-build@^0.8\" && set LEPTOS_OUTPUT_NAME=chatbot&& worker-build --release --features ssr"

[assets]
directory = "./target/site"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "Chat"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "Chat" ]
